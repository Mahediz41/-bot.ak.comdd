<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Boat Theme</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to top, #003366, #66ccff);
    overflow: hidden;
}

/* Heading */
h1 {
    text-align: center;
    color: white;
    margin-top: 30px;
    font-size: 40px;
    text-shadow: 2px 2px 5px black;
}

/* Water */
.water {
    position: absolute;
    bottom: 0;
    width: 100%;
    height: 200px;
    background: #0066cc;
}

/* Boat */
.boat {
    position: absolute;
    bottom: 120px;
    left: -150px;
    width: 120px;
    height: 60px;
    background: brown;
    border-radius: 0 0 30px 30px;
    animation: sail 8s linear infinite;
}

/* Sail */
.sail {
    position: absolute;
    bottom: 60px;
    left: 40px;
    width: 0;
    height: 0;
    border-left: 40px solid white;
    border-top: 30px solid transparent;
    border-bottom: 30px solid transparent;
}

/* Animation */
@keyframes sail {
    0% { left: -150px; }
    100% { left: 110%; }
}
</style>

</head>
<body>

<h1>BT Mahedi Hasan Joy</h1>

<div class="boat">
    <div class="sail"></div>
</div>

<div class="water"></div>

</body>
</html>
